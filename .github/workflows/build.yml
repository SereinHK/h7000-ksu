name: build-h7000-kernel

on:
  workflow_dispatch:
    inputs:
      chip:
        description: "FocalTech 芯片型号（_FT8719 / _FT8716 / _FT8736 / _FT8739 …）"
        type: string
        default: "_FT8201"
      ksu:
        description: "同时集成 KernelSU（暂未启用）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev python3 zip unzip xxd \
            lib32z1 lib32stdc++6 ca-certificates

      - name: 下载 AOSP GCC 4.9 工具链 (aarch64)
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 tc
          ./tc/bin/aarch64-linux-android-gcc --version | head -1
          echo "$GITHUB_WORKSPACE/tc/bin" >> "$GITHUB_PATH"

      - name: 拉取内核源码
        run: |
          git clone --depth 1 --branch kernel-src https://github.com/SereinHK/h7000-ksu.git kernel
          cd kernel && git log -1 --oneline && head -5 Makefile

      - name: 修补源码（厂商魔改的 define_trace.h）
        run: |
          cd kernel
          sed -i 's|^//#include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|#include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|' include/trace/define_trace.h
          sed -i 's|^#include "../../drivers/gpu/msm/kgsl_trace.h"|/* vendor hack removed by CI */|' include/trace/define_trace.h

      - name: 加入 FocalTech 触摸驱动
        run: |
          cd kernel
          cp -r "$GITHUB_WORKSPACE/vendor/focaltech_touch" drivers/input/touchscreen/focaltech_touch
          grep -q 'focaltech_touch' drivers/input/touchscreen/Makefile || \
            echo 'obj-$(CONFIG_TOUCHSCREEN_FTS) += focaltech_touch/' >> drivers/input/touchscreen/Makefile
          grep -q 'focaltech_touch/Kconfig' drivers/input/touchscreen/Kconfig || \
            echo 'source "drivers/input/touchscreen/focaltech_touch/Kconfig"' >> drivers/input/touchscreen/Kconfig
          sed -i 's|^#define FTS_CHIP_TYPE.*|#define FTS_CHIP_TYPE   ${{ inputs.chip }}|' \
            drivers/input/touchscreen/focaltech_touch/focaltech_config.h
          # 这版驱动的 Makefile 用 CONFIG_RIGOL 作开关，改成我们的符号
          sed -i 's|obj-$(CONFIG_RIGOL)|obj-$(CONFIG_TOUCHSCREEN_FTS)|' \
            drivers/input/touchscreen/focaltech_touch/Makefile
          echo "--- chip ---"; grep -n 'FTS_CHIP_TYPE' drivers/input/touchscreen/focaltech_touch/focaltech_config.h
          echo "--- kconfig tail ---"; tail -3 drivers/input/touchscreen/Kconfig
          echo "--- makefile tail ---"; tail -3 drivers/input/touchscreen/Makefile
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('drivers/input/touchscreen/focaltech_touch/focaltech_core.c')
          s = p.read_text()
          s = s.replace('extern void mdss_panel_reset_skip_enable(bool enable);',
                        'static inline void mdss_panel_reset_skip_enable(bool enable) { (void)enable; }')
          s = s.replace('extern bool mdss_panel_is_prim(void *fbinfo);',
                        'static inline bool mdss_panel_is_prim(void *fbinfo) { (void)fbinfo; return true; }')
          p.write_text(s)
          print('patched mdss helpers')
          EOF
          # 让厂商 .ko 能加载：关掉模块签名校验
          cat >> arch/arm64/configs/h7000_defconfig <<'EOF'
          # CONFIG_MODULE_SIG is not set
          # CONFIG_MODULE_SIG_FORCE is not set
          # CONFIG_MODULE_SIG_ALL is not set
          EOF
          # 提交掉所有改动，让 git 树干净 -> 内核版本号不会多出 "+"
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "ci patches" || true
          git status --porcelain | head -5
          echo "(空表示树是干净的)"

      - name: 拉取 WLAN 驱动源码（qcacld-3.0 + qca-wifi-host-cmn）
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b lineage-17.1 \
            https://github.com/LineageOS/android_kernel_xiaomi_sdm660.git wlansrc
          cd wlansrc
          git sparse-checkout set drivers/staging/qcacld-3.0 drivers/staging/qca-wifi-host-cmn drivers/staging/fw-api
          du -sh drivers/staging/qcacld-3.0 drivers/staging/qca-wifi-host-cmn drivers/staging/fw-api
          ls drivers/staging/qcacld-3.0 | head -5
          # 装进我们的内核树
          cp -r drivers/staging/qcacld-3.0 drivers/staging/qca-wifi-host-cmn drivers/staging/fw-api "$GITHUB_WORKSPACE/kernel/drivers/staging/"
          cd "$GITHUB_WORKSPACE/kernel"
          grep -q 'qcacld-3.0/Kconfig' drivers/staging/Kconfig || \
            echo 'source "drivers/staging/qcacld-3.0/Kconfig"' >> drivers/staging/Kconfig
          grep -q 'qcacld-3.0/' drivers/staging/Makefile || {
            echo 'obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/' >> drivers/staging/Makefile
          }
          echo "--- staging Makefile tail ---"; tail -4 drivers/staging/Makefile
          echo "--- staging Kconfig tail ---"; tail -3 drivers/staging/Kconfig

      - name: 配置（用官方 .config，保证模块 ABI 一致）
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          mkdir -p out
          cp "$GITHUB_WORKSPACE/configs/stock.config" out/.config
          # 只关掉强制签名校验，保留 MODULE_SIG；MODVERSIONS 保持开启——现在 WLAN 模块是我们自己编的，CRC 自然一致
          scripts/config --file out/.config -d MODULE_SIG_FORCE
          scripts/config --file out/.config -d MODVERSIONS
          scripts/config --file out/.config -d DEBUG_INFO
          scripts/config --file out/.config -m QCA_CLD_WLAN
          make O=out olddefconfig
          grep -E '^(CONFIG_MODULE_SIG|# CONFIG_MODULE_SIG_FORCE|CONFIG_MODULE_SIG_ALL|CONFIG_LOCALVERSION=)' out/.config
          grep -E '^CONFIG_TOUCHSCREEN_FTS' out/.config
          grep -E '^(CONFIG_QCA_CLD_WLAN|CONFIG_WLAN=)' out/.config
          python3 - <<'EOF'
          import os, re
          def parse(path):
              d = {}
              for line in open(path):
                  s = line.strip()
                  m = re.match(r'# (CONFIG_\w+) is not set', s)
                  if m:
                      d[m.group(1)] = 'n'; continue
                  m = re.match(r'(CONFIG_\w+)=(.*)', s)
                  if m:
                      d[m.group(1)] = m.group(2)
              return d
          stock = parse(os.environ.get('GITHUB_WORKSPACE', '.') + '/configs/stock.config')
          built = parse('out/.config')
          keys = set(stock) | set(built)
          diff = sorted(k for k in keys if stock.get(k) != built.get(k))
          print(f'config diff: {len(diff)} symbols')
          pat = re.compile(r'MODULE|MODVERSIONS|TRACE|KPROBE|LIVEPATCH|UNWINDER|STACKTRACE|JUMP_LABEL|KALLSYMS|FTRACE|EVENT_TRACING|PERF_EVENTS')
          important = [k for k in diff if pat.search(k)]
          print('module-ABI related diffs:', len(important))
          for k in important[:60]:
              print(f'  {k}: stock={stock.get(k)} built={built.get(k)}')
          other = [k for k in diff if k not in important]
          print('other diffs:', len(other))
          for k in other[:30]:
              print(f'  {k}: stock={stock.get(k)} built={built.get(k)}')
          EOF

      - name: 编译 Image
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          # 版本号钉死成 4.4.153-perf（厂商 .ko 的 vermagic 要求），否则会多出 "+"
          touch .scmversion
          make O=out -j"$(nproc)" CC="${CROSS_COMPILE}gcc" HOSTCFLAGS="-fcommon" Image modules
          echo "--- version ---"; grep -E 'UTS_RELEASE' out/include/generated/utsrelease.h
          echo "--- 模块 ---"; find out -name '*.ko' | head -10
          WLAN=out/drivers/staging/qcacld-3.0/wlan.ko
          ls -l "$WLAN"
          aarch64-linux-android-strip --strip-debug "$WLAN"
          echo "--- strip 后 ---"; ls -l "$WLAN"; file "$WLAN" || true
          mkdir -p "$GITHUB_WORKSPACE/wlanout"; cp "$WLAN" "$GITHUB_WORKSPACE/wlanout/wlan.ko"

      - name: 检查产物
        run: |
          ls -l kernel/out/arch/arm64/boot/Image
          xxd -l 64 kernel/out/arch/arm64/boot/Image

      - name: 打包 boot.img
        run: |
          python3 scripts/repack.py kernel/out/arch/arm64/boot/Image assets out

      - name: 上传 WLAN 模块（单独的小包）
        uses: actions/upload-artifact@v4
        with:
          name: wlan-ko
          path: wlanout/wlan.ko

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: boot-img
          path: |
            out/boot.img
            kernel/out/arch/arm64/boot/Image
            kernel/out/drivers/staging/qcacld-3.0/wlan.ko
            kernel/out/drivers/staging/qcacld-3.0/**/*.ko
