name: build-h7000-kernel

on:
  workflow_dispatch:
    inputs:
      chip:
        description: "FocalTech 芯片型号（_FT8719 / _FT8716 / _FT8736 / _FT8739 …）"
        type: string
        default: "_FT8719"
      ksu:
        description: "同时集成 KernelSU（暂未启用）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev python3 zip unzip xxd \
            lib32z1 lib32stdc++6 ca-certificates

      - name: 下载 AOSP GCC 4.9 工具链 (aarch64)
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 tc
          ./tc/bin/aarch64-linux-android-gcc --version | head -1
          echo "$GITHUB_WORKSPACE/tc/bin" >> "$GITHUB_PATH"

      - name: 拉取内核源码
        run: |
          git clone --depth 1 --branch kernel-src https://github.com/SereinHK/h7000-ksu.git kernel
          cd kernel && git log -1 --oneline && head -5 Makefile

      - name: 修补源码（厂商魔改的 define_trace.h）
        run: |
          cd kernel
          sed -i 's|^//#include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|#include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|' include/trace/define_trace.h
          sed -i 's|^#include "../../drivers/gpu/msm/kgsl_trace.h"|/* vendor hack removed by CI */|' include/trace/define_trace.h

      - name: 加入 FocalTech 触摸驱动
        run: |
          cd kernel
          cp -r "$GITHUB_WORKSPACE/vendor/focaltech_touch" drivers/input/touchscreen/focaltech_touch
          grep -q 'focaltech_touch' drivers/input/touchscreen/Makefile || \
            echo 'obj-$(CONFIG_TOUCHSCREEN_FTS) += focaltech_touch/' >> drivers/input/touchscreen/Makefile
          grep -q 'focaltech_touch/Kconfig' drivers/input/touchscreen/Kconfig || \
            echo 'source "drivers/input/touchscreen/focaltech_touch/Kconfig"' >> drivers/input/touchscreen/Kconfig
          sed -i 's|^#define FTS_CHIP_TYPE.*|#define FTS_CHIP_TYPE   ${{ inputs.chip }}|' \
            drivers/input/touchscreen/focaltech_touch/focaltech_config.h
          echo "--- chip ---"; grep -n 'FTS_CHIP_TYPE' drivers/input/touchscreen/focaltech_touch/focaltech_config.h
          echo "--- kconfig tail ---"; tail -3 drivers/input/touchscreen/Kconfig
          echo "--- makefile tail ---"; tail -3 drivers/input/touchscreen/Makefile

      - name: 配置 (h7000_defconfig)
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out h7000_defconfig
          grep -E 'TOUCHSCREEN_FTS|TOUCHSCREEN_FTS_DIRECTORY' out/.config || true

      - name: 编译 Image
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out -j"$(nproc)" CC="${CROSS_COMPILE}gcc" HOSTCFLAGS="-fcommon" Image

      - name: 检查产物
        run: |
          ls -l kernel/out/arch/arm64/boot/Image
          xxd -l 64 kernel/out/arch/arm64/boot/Image

      - name: 打包 boot.img
        run: |
          python3 scripts/repack.py kernel/out/arch/arm64/boot/Image assets out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: boot-img
          path: |
            out/boot.img
            kernel/out/arch/arm64/boot/Image
